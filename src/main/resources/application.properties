spring.application.name=mock-server

# Deployed as a standalone JAR with embedded Tomcat (was previously deployed
# as a WAR to an external Tomcat, where the context path came implicitly
# from the WAR's filename). Explicit here to replicate the same path.
server.servlet.context-path=/mock-server

spring.session.jdbc.initialize-schema=always
spring.servlet.session.timeout=540s

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext

# spring.datasource.* supplied via environment variables (SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD) — see docker-compose .env
